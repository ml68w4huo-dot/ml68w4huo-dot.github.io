<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL生成器</title>
</head>
<body>
    <h1>URL生成器</h1>
    <input type="url" id="urlInput" placeholder="https://example.com">
    <a id="urlLink"></a>
    <iframe src="" id="urlFrame" style="width: 100%; height: 500px;"></iframe>
    <script>
        const urlInput = document.getElementById("urlInput");
        const link = document.getElementById("urlLink");
        const frame = document.getElementById("urlFrame");

        function updateLink() {
            const url = urlInput.value.trim();
            link.href = url;
            link.textContent = url;
            link.hidden = !url;
            frame.src = url || "about:blank";
        }

        urlInput.addEventListener("input", updateLink);

        // main.jsから window.updateUrl(url) を呼び出すと表示先を更新できます。
        window.updateUrl = function(url) {
            urlInput.value = url || "";
            updateLink();
        };

        updateLink();
    </script>
    <script src="main.js"></script>
</body>
</html>
